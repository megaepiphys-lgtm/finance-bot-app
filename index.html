<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансовый помощник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #app {
            max-width: 400px;
            width: 100%;
        }
        .balance-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: #f5c842;
        }
        .balance-details {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .income {
            color: #4caf50;
        }
        .expense {
            color: #ef5350;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            background: #1e1e1e;
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active {
            background: #2a2a2a;
        }
        .btn-primary {
            background: #2e7d32;
        }
        .btn-danger {
            background: #c62828;
        }
        .btn-gold {
            background: #b8860b;
        }
        .input-group {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .back-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            padding: 10px 0;
            cursor: pointer;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="mainScreen" class="active">
            <div class="balance-card">
                <div>💰 Баланс</div>
                <div class="balance-amount" id="balanceAmount">0 ₽</div>
                <div class="balance-details">
                    <span>↗️ Доходы: <span class="income" id="incomeAmount">0 ₽</span></span>
                    <span>↘️ Расходы: <span class="expense" id="expenseAmount">0 ₽</span></span>
                </div>
            </div>

            <div class="grid-2">
                <button class="btn btn-primary" onclick="showSection('income')">➕ Доход</button>
                <button class="btn btn-danger" onclick="showSection('expense')">➖ Расход</button>
                <button class="btn" onclick="sendCommand('balance')">💰 Баланс</button>
                <button class="btn" onclick="sendCommand('report')">📊 Отчёт</button>
                <button class="btn" onclick="sendCommand('history')">📋 История</button>
                <button class="btn" onclick="sendCommand('excel')">📤 Excel</button>
                <button class="btn btn-gold" onclick="sendCommand('donate')">⭐ Донат</button>
                <button class="btn" onclick="sendCommand('review')">💬 Отзыв</button>
                <button class="btn" onclick="sendCommand('help')">❓ Помощь</button>
            </div>
            <div class="footer-text">Нажми на кнопку — бот ответит в Telegram</div>
        </div>

        <!-- ДОХОД -->
        <div id="incomeSection" class="section">
            <button class="back-btn" onclick="showSection('main')">← Назад</button>
            <h3>💰 Добавить доход</h3>
            <div class="input-group">
                <label>Сумма</label>
                <input type="number" id="incomeAmountInput" placeholder="Например: 15000" />
            </div>
            <div class="input-group">
                <label>Категория</label>
                <select id="incomeCategory">
                    <option value="💰 Зарплата">💰 Зарплата</option>
                    <option value="💼 Фриланс">💼 Фриланс</option>
                    <option value="💰 Другое">💰 Другое</option>
                </select>
            </div>
            <div class="input-group">
                <label>Описание</label>
                <input type="text" id="incomeDesc" placeholder="Необязательно" />
            </div>
            <button class="btn btn-primary" onclick="sendIncome()">✅ Сохранить доход</button>
        </div>

        <!-- РАСХОД -->
        <div id="expenseSection" class="section">
            <button class="back-btn" onclick="showSection('main')">← Назад</button>
            <h3>💸 Добавить расход</h3>
            <div class="input-group">
                <label>Сумма</label>
                <input type="number" id="expenseAmountInput" placeholder="Например: 500" />
            </div>
            <div class="input-group">
                <label>Категория</label>
                <select id="expenseCategory">
                    <option value="🍔 Еда">🍔 Еда</option>
                    <option value="🚇 Транспорт">🚇 Транспорт</option>
                    <option value="💰 Другое">💰 Другое</option>
                </select>
            </div>
            <div class="input-group">
                <label>Описание</label>
                <input type="text" id="expenseDesc" placeholder="Необязательно" />
            </div>
            <button class="btn btn-danger" onclick="sendExpense()">✅ Сохранить расход</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const SERVER_URL = 'https://finance-bot-ldes.onrender.com';

        function updateBalance() {
            const chatId = tg.initDataUnsafe?.user?.id;
            if (!chatId) return;
            fetch(`${SERVER_URL}/balance?chat_id=${chatId}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('balanceAmount').textContent = d.balance + ' ₽';
                    document.getElementById('incomeAmount').textContent = d.income + ' ₽';
                    document.getElementById('expenseAmount').textContent = d.expense + ' ₽';
                })
                .catch(() => {});
        }

        function sendToBot(text) {
            const chatId = tg.initDataUnsafe?.user?.id;
            if (!chatId) {
                alert('❌ Ошибка: нет chat_id');
                return;
            }
            fetch(`${SERVER_URL}/webhook`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            })
            .then(r => r.json())
            .then(() => {
                alert('✅ Команда отправлена');
                updateBalance();
            })
            .catch(() => alert('❌ Ошибка отправки'));
        }

        function sendCommand(cmd) {
            const map = {
                balance: '💰 Баланс',
                report: '📊 Отчёт',
                history: '📋 История',
                excel: '📤 Выгрузка в Excel',
                donate: '⭐ Донат 10',
                review: '💬 Отзыв',
                help: '❓ Инструкция'
            };
            sendToBot(map[cmd] || cmd);
        }

        function sendIncome() {
            const amount = document.getElementById('incomeAmountInput').value;
            const category = document.getElementById('incomeCategory').value;
            const desc = document.getElementById('incomeDesc').value;
            if (!amount || amount <= 0) return alert('Введите сумму');
            sendToBot(`Доход ${amount} ${category}${desc ? ' ' + desc : ''}`);
        }

        function sendExpense() {
            const amount = document.getElementById('expenseAmountInput').value;
            const category = document.getElementById('expenseCategory').value;
            const desc = document.getElementById('expenseDesc').value;
            if (!amount || amount <= 0) return alert('Введите сумму');
            sendToBot(`Расход ${amount} ${category}${desc ? ' ' + desc : ''}`);
        }

        function showSection(section) {
            ['main', 'income', 'expense'].forEach(id => {
                const el = document.getElementById(id + 'Section') || document.getElementById(id + 'Screen');
                if (el) {
                    el.classList.remove('active');
                    el.style.display = 'none';
                }
            });
            if (section === 'main') {
                const main = document.getElementById('mainScreen');
                main.style.display = 'block';
                main.classList.add('active');
            } else {
                const el = document.getElementById(section + 'Section');
                if (el) {
                    el.style.display = 'block';
                    el.classList.add('active');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            showSection('main');
            updateBalance();
        });
    </script>
</body>
</html>
