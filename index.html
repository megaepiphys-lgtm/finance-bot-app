<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Финансовый помощник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        #app {
            max-width: 400px;
            width: 100%;
        }
        .balance-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: #f5c842;
        }
        .balance-details {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .income {
            color: #4caf50;
        }
        .expense {
            color: #ef5350;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            background: #1e1e1e;
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn:active {
            background: #2a2a2a;
        }
        .btn-green {
            background: #2e7d32;
        }
        .btn-red {
            background: #c62828;
        }
        .btn-gold {
            background: #b8860b;
        }
        .btn-admin {
            background: #4a148c;
        }
        .input-group {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .back-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            padding: 10px 0;
            cursor: pointer;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Главный экран -->
        <div id="mainScreen" class="active">
            <div class="balance-card">
                <div>💰 Баланс</div>
                <div class="balance-amount" id="balanceAmount">0 ₽</div>
                <div class="balance-details">
                    <span>↗️ Доходы: <span class="income" id="incomeAmount">0 ₽</span></span>
                    <span>↘️ Расходы: <span class="expense" id="expenseAmount">0 ₽</span></span>
                </div>
            </div>

            <div class="grid-2">
                <button class="btn btn-green" onclick="showSection('income')">➕ Доход</button>
                <button class="btn btn-red" onclick="showSection('expense')">➖ Расход</button>
                <button class="btn" onclick="sendCommand('balance')">💰 Баланс</button>
                <button class="btn" onclick="sendCommand('report')">📊 Отчёт</button>
                <button class="btn" onclick="sendCommand('budget')">📈 Бюджет</button>
                <button class="btn" onclick="sendCommand('history')">📋 История</button>
                <button class="btn" onclick="sendCommand('excel')">📤 Excel</button>
                <button class="btn btn-gold" onclick="sendCommand('donate')">⭐ Донат</button>
                <button class="btn" onclick="sendCommand('review')">💬 Отзыв</button>
                <button class="btn" onclick="sendCommand('help')">❓ Инструкция</button>
                <button class="btn btn-red" onclick="sendCommand('reset')">🗑️ Сброс</button>
                <div id="adminSection" style="display:none; margin-top: 10px;">
                    <button class="btn btn-admin" onclick="sendCommand('stats')" style="width:100%;">📊 Статистика</button>
                </div>
            </div>
            <div class="footer-text">Нажми кнопку — бот ответит в Telegram</div>
        </div>

        <!-- Доход -->
        <div id="incomeSection" class="section">
            <button class="back-btn" onclick="showSection('main')">← Назад</button>
            <h3>💰 Добавить доход</h3>
            <div class="input-group">
                <label>Сумма</label>
                <input type="number" id="incomeAmountInput" />
            </div>
            <div class="input-group">
                <label>Категория</label>
                <select id="incomeCategory">
                    <option>💰 Зарплата</option>
                    <option>💼 Фриланс</option>
                    <option>🎁 Подарок</option>
                    <option>📈 Инвестиции</option>
                    <option>🏦 Проценты</option>
                    <option>🔄 Возврат</option>
                    <option>💰 Другое</option>
                </select>
            </div>
            <div class="input-group">
                <label>Описание</label>
                <input type="text" id="incomeDesc" />
            </div>
            <button class="btn btn-green" onclick="sendIncome()">✅ Сохранить доход</button>
        </div>

        <!-- Расход -->
        <div id="expenseSection" class="section">
            <button class="back-btn" onclick="showSection('main')">← Назад</button>
            <h3>💸 Добавить расход</h3>
            <div class="input-group">
                <label>Сумма</label>
                <input type="number" id="expenseAmountInput" />
            </div>
            <div class="input-group">
                <label>Категория</label>
                <select id="expenseCategory">
                    <option>🍔 Еда</option>
                    <option>🚇 Транспорт</option>
                    <option>🏠 ЖКХ</option>
                    <option>🛍️ Покупки</option>
                    <option>💊 Здоровье</option>
                    <option>🎉 Развлечения</option>
                    <option>📱 Связь</option>
                    <option>👕 Одежда</option>
                    <option>📚 Образование</option>
                    <option>💰 Другое</option>
                </select>
            </div>
            <div class="input-group">
                <label>Описание</label>
                <input type="text" id="expenseDesc" />
            </div>
            <button class="btn btn-red" onclick="sendExpense()">✅ Сохранить расход</button>
        </div>
    </div>

    <!-- Тостер -->
    <div id="toast" class="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const SERVER_URL = 'https://finance-bot-ldes.onrender.com';

        function showToast(text) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function updateBalance() {
            const chatId = tg.initDataUnsafe?.user?.id;
            if (!chatId) return;
            fetch(`${SERVER_URL}/balance?chat_id=${chatId}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('balanceAmount').textContent = d.balance + ' ₽';
                    document.getElementById('incomeAmount').textContent = d.income + ' ₽';
                    document.getElementById('expenseAmount').textContent = d.expense + ' ₽';
                })
                .catch(() => {});
        }

        function sendToBot(text) {
            const chatId = tg.initDataUnsafe?.user?.id;
            if (!chatId) {
                showToast('❌ Ошибка: нет chat_id');
                return;
            }
            fetch(`${SERVER_URL}/webhook`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text })
            })
            .then(r => r.json())
            .then(() => {
                showToast('✅ Команда отправлена');
                updateBalance();
                showSection('main');
            })
            .catch(() => showToast('❌ Ошибка отправки'));
        }

        function sendCommand(cmd) {
            const map = {
                balance: '💰 Баланс',
                report: '📊 Отчёт',
                budget: '📈 Бюджет',
                history: '📋 История',
                excel: '📤 Выгрузка в Excel',
                donate: '⭐ Донат 10',
                review: '💬 Отзыв',
                help: '❓ Инструкция',
                reset: '🗑️ Сбросить всё',
                stats: '📊 Статистика'
            };
            sendToBot(map[cmd] || cmd);
        }

        function sendIncome() {
            const amount = document.getElementById('incomeAmountInput').value;
            const category = document.getElementById('incomeCategory').value;
            const desc = document.getElementById('incomeDesc').value;
            if (!amount || amount <= 0) {
                showToast('❌ Введите сумму');
                return;
            }
            sendToBot(`Доход ${amount} ${category}${desc ? ' ' + desc : ''}`);
            document.getElementById('incomeAmountInput').value = '';
            document.getElementById('incomeDesc').value = '';
        }

        function sendExpense() {
            const amount = document.getElementById('expenseAmountInput').value;
            const category = document.getElementById('expenseCategory').value;
            const desc = document.getElementById('expenseDesc').value;
            if (!amount || amount <= 0) {
                showToast('❌ Введите сумму');
                return;
            }
            sendToBot(`Расход ${amount} ${category}${desc ? ' ' + desc : ''}`);
            document.getElementById('expenseAmountInput').value = '';
            document.getElementById('expenseDesc').value = '';
        }

        function showSection(section) {
            ['main', 'income', 'expense'].forEach(id => {
                const el = document.getElementById(id + 'Section') || document.getElementById(id + 'Screen');
                if (el) {
                    el.classList.remove('active');
                    el.style.display = 'none';
                }
            });
            if (section === 'main') {
                const main = document.getElementById('mainScreen');
                if (main) {
                    main.style.display = 'block';
                    main.classList.add('active');
                }
            } else {
                const el = document.getElementById(section + 'Section');
                if (el) {
                    el.style.display = 'block';
                    el.classList.add('active');
                }
            }
        }

        const chatId = tg.initDataUnsafe?.user?.id;
        if (chatId == 7461823442) {
            document.getElementById('adminSection').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', function() {
            showSection('main');
            updateBalance();
        });
    </script>
</body>
</html>
